# aura-runtime is its own workspace: it needs `panic = "abort"`, which
# Cargo only accepts in root profiles — it can't live in the compiler
# workspace without forcing that strategy on the test harness too.
[workspace]

[package]
name = "aura-runtime"
version = "0.1.0-alpha"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

name: Pages

# Deploys the website to GitHub Pages on every master push that
# touches the site inputs — no release tag needed. The tag-driven
# release.yml only handles artifacts (installer, zip, vsix).

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'testsuite/**'
      - 'scripts/build-site.ps1'
      - '.github/workflows/pages.yml'
  workflow_dispatch: {}

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook (prebuilt binary)
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build site
        shell: pwsh
        run: ./scripts/build-site.ps1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy-pages:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

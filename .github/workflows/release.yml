name: Release

# Tag-driven release: `git tag v0.1.0-alpha && git push --tags`.
# Produces the installer, portable ZIP, .vsix and SHA256SUMS on a
# GitHub Release, then deploys the website to GitHub Pages.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write   # create releases
  pages: write      # deploy Pages
  id-token: write   # Pages OIDC

env:
  CARGO_TERM_COLOR: always
  AURA_VERSION: 0.1.0-alpha

jobs:
  dist:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Gates (fmt, clippy, tests, docs-examples)
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Validation suite (aura test — 50 scenarios)
        run: cargo run --release -p aura-cli -- test

      - name: Icons
        shell: pwsh
        run: ./scripts/make-icons.ps1

      - name: VS Code extension (.vsix)
        working-directory: editors/vscode
        run: |
          npm ci
          npx vsce package --out aura-lang-0.1.0.vsix

      - name: Package dist (aura.exe + runtime + bundled lld-link)
        shell: bash
        run: ./scripts/package-dist.sh ${{ env.AURA_VERSION }} x86_64-pc-windows-msvc

      - name: Smoke-test the dist on a bare PATH
        shell: pwsh
        run: |
          $pkg = "dist/aura-${{ env.AURA_VERSION }}-x86_64-pc-windows-msvc"
          $env:Path = "C:\Windows\System32;$PWD/$pkg"
          $env:USERPROFILE = "$env:TEMP/fakehome"   # hide ~/.rustup
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          & "$pkg/aura.exe" --version
          @'
          fn main() -> i64 {
              println("ci-ok")
              0
          }
          '@ | Set-Content "$env:TEMP/t.aura"
          & "$pkg/aura.exe" build "$env:TEMP/t.aura" -o "$env:TEMP/t.exe"
          $out = & "$env:TEMP/t.exe"
          if ($out -ne "ci-ok") { throw "compiled binary wrong: $out" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) {
              $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            }
          }
          & $iscc installer\aura.iss

      - name: ZIP fallback + checksums
        shell: pwsh
        run: |
          $pkg = "dist/aura-${{ env.AURA_VERSION }}-x86_64-pc-windows-msvc"
          Compress-Archive -Path "$pkg/*" -DestinationPath "dist/aura-${{ env.AURA_VERSION }}-windows-x86_64.zip"
          $files = @(
            "installer/AuraSetup-${{ env.AURA_VERSION }}.exe",
            "dist/aura-${{ env.AURA_VERSION }}-windows-x86_64.zip",
            "$pkg/aura-lang-0.1.0.vsix"
          )
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $f -Leaf)"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: GitHub Release + assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/AuraSetup-*.exe
            dist/aura-*-windows-x86_64.zip
            dist/SHA256SUMS.txt
            dist/aura-*-x86_64-pc-windows-msvc/aura-lang-0.1.0.vsix
          generate_release_notes: true

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook (prebuilt binary)
        run: |
          mkdir -p $HOME/.local/bin
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build site
        shell: pwsh
        run: ./scripts/build-site.ps1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy-pages:
    needs: site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
